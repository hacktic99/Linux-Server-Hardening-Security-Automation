<g font-family="monospace" font-size="18"><text x="40" y="104" fill="#79d4a5">$ sudo firewall-cmd --get-active-zones</text><text x="40" y="140" fill="#dce5ee">public</text><text x="40" y="174" fill="#dce5ee">  interfaces: ens192</text><text x="40" y="234" fill="#79d4a5">$ sudo firewall-cmd --zone=public --list-all</text><text x="40" y="270" fill="#dce5ee">public (active)</text><text x="40" y="304" fill="#dce5ee">  target: default</text><text x="40" y="338" fill="#dce5ee">  services: cockpit dhcpv6-client ssh</text><text x="40" y="372" fill="#dce5ee">  ports: </text><text x="40" y="430" fill="#79d4a5">$ # Compare with approved flows and test from the source network.</text></g>
