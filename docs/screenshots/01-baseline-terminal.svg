<g font-family="monospace" font-size="17"><text x="38" y="100" fill="#79d4a5">$ hostnamectl</text><text x="38" y="130" fill="#dce5ee"> Static hostname: rhel-lab-01</text><text x="38" y="158" fill="#dce5ee"> Operating System: Red Hat Enterprise Linux 9.x</text><text x="38" y="186" fill="#dce5ee"> Kernel: Linux 5.x.x</text><text x="38" y="236" fill="#79d4a5">$ getenforce</text><text x="38" y="266" fill="#e9c46a">Enforcing</text><text x="38" y="316" fill="#79d4a5">$ sudo ss -lntup</text><text x="38" y="346" fill="#dce5ee">Netid  State  Local Address:Port   Process</text><text x="38" y="374" fill="#dce5ee">tcp    LISTEN 0.0.0.0:22            sshd</text><text x="38" y="402" fill="#dce5ee">tcp    LISTEN 127.0.0.1:5432        example-db</text><text x="38" y="452" fill="#79d4a5">$ sudo firewall-cmd --get-active-zones</text><text x="38" y="482" fill="#dce5ee">public: ens192</text></g>
