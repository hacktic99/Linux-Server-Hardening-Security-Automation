<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d">
<title id="t">Illustrative SSH validation terminal</title><desc id="d">Mock terminal illustrating syntax validation and effective SSH settings.</desc>
<rect width="1000" height="500" rx="16" fill="#0c1118"/><path d="M0 16a16 16 0 0 1 16-16h968a16 16 0 0 1 16 16v42H0z" fill="#202a37"/><circle cx="28" cy="28" r="7" fill="#fa6b68"/><circle cx="52" cy="28" r="7" fill="#efc15c"/><circle cx="76" cy="28" r="7" fill="#63c58a"/><text x="500" y="34" fill="#e8edf4" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">SSH validation — illustrative terminal</text>
<g font-family="monospace" font-size="18"><text x="40" y="104" fill="#79d4a5">$ sudo sshd -t</text><text x="40" y="134" fill="#9bd7ac"># No output: syntax validation succeeded in this example.</text><text x="40" y="194" fill="#79d4a5">$ sudo sshd -T | grep authentication</text><text x="40" y="232" fill="#dce5ee">permitrootlogin no</text><text x="40" y="266" fill="#dce5ee">pubkeyauthentication yes</text><text x="40" y="300" fill="#dce5ee">passwordauthentication no</text><text x="40" y="360" fill="#79d4a5">$ systemctl is-active sshd</text><text x="40" y="394" fill="#9bd7ac">active</text><text x="40" y="444" fill="#79d4a5">$ # Test a second key-based session before closing the first.</text></g>
<rect x="28" y="458" width="944" height="28" rx="6" fill="#382d19"/><text x="46" y="477" fill="#f7d58b" font-family="Arial,sans-serif" font-size="13">MOCK OUTPUT — not proof of live configuration or successful login.</text></svg>