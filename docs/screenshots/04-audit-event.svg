<title id="t">Illustrative auditd event terminal</title><desc id="d">Mock ausearch output showing a matching audit key and file path.</desc>
<rect width="1000" height="500" rx="16" fill="#0c1118"/><path d="M0 16a16 16 0 0 1 16-16h968a16 16 0 0 1 16 16v42H0z" fill="#202a37"/><circle cx="28" cy="28" r="7" fill="#fa6b68"/><circle cx="52" cy="28" r="7" fill="#efc15c"/><circle cx="76" cy="28" r="7" fill="#63c58a"/><text x="500" y="34" fill="#e8edf4" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">auditd event review — illustrative terminal</text>
<g font-family="monospace" font-size="17"><text x="40" y="104" fill="#79d4a5">$ sudo auditctl -l</text><text x="40" y="140" fill="#dce5ee">-w /etc/ssh/sshd_config -p wa -k sshd_config_changes</text><text x="40" y="202" fill="#79d4a5">$ sudo ausearch -k sshd_config_changes -i</text><text x="40" y="240" fill="#dce5ee">type=CONFIG_CHANGE msg=audit(...:1042)</text><text x="40" y="274" fill="#dce5ee">type=SYSCALL ... success=yes ... auid=admin-lab</text><text x="40" y="308" fill="#dce5ee">type=PATH ... name=/etc/ssh/sshd_config</text><text x="40" y="376" fill="#9bd7ac">Interpret event ID, timestamp, account, executable, path and result.</text><text x="40" y="430" fill="#79d4a5">$ # Verify audit storage and retention.</text></g>
<rect x="28" y="458" width="944" height="28" rx="6" fill="#382d19"/><text x="46" y="477" fill="#f7d58b" font-family="Arial,sans-serif" font-size="13">MOCK OUTPUT — fabricated example; not evidence of a real audit event.</text></svg>